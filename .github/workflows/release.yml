name: Release

# Run manually and pick a version bump. The workflow bumps package.json, runs
# the checks, and publishes:
#   - a `v*` tag that points at a build commit containing `dist/`, so OpenCode
#     can install the plugin straight from git without running build scripts
#   - a GitHub release with the packed tarball and its checksum
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        required: true
        default: patch
        options: [patch, minor, major, prepatch, preminor, premajor, prerelease]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "::error::Run this workflow from a branch, not a tag"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ] && [ "${BUMP#pre}" = "$BUMP" ]; then
            echo "::error::Only pre-releases can be cut outside $DEFAULT_BRANCH"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          npm version "$BUMP" --preid rc --no-git-tag-version
          version="$(node -p "require('./package.json').version")"
          git commit --all --message "Release v$version"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - run: npm run check

      - name: Pack
        run: |
          npm pack
          sha256sum opencode-sentry-monitor-*.tgz > SHA256SUMS

      # The tag gets its own commit on top of the release commit: the compiled
      # output is added, and the scripts and dev dependencies are dropped so
      # installing from git never tries to build.
      - name: Tag the build
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          npm pkg delete scripts devDependencies
          git add --force dist
          git commit --all --message "Build $TAG"
          git tag --annotate "$TAG" --message "$TAG"

      # Pushed only once everything above passed, so a failed release never
      # leaves a version commit or tag behind.
      - name: Push release commit and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: git push --atomic origin "HEAD~1:refs/heads/$GITHUB_REF_NAME" "$TAG"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            --prerelease="$PRERELEASE" \
            opencode-sentry-monitor-*.tgz SHA256SUMS
